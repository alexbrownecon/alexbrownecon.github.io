<script>
// Safari destroys an embedded PDF viewer when CSS hides it (window narrowed
// below 700px) and does not restore it on unhide; reload the frame whenever
// the viewport crosses back above the threshold.
(function () {
  var mq = window.matchMedia('(min-width: 701px)');
  function reload(e) {
    if (e.matches) {
      var f = document.querySelector('.cv-embed');
      if (f) { f.src = f.getAttribute('src'); }
    }
  }
  if (mq.addEventListener) { mq.addEventListener('change', reload); }
  else if (mq.addListener) { mq.addListener(reload); }
})();
</script>
